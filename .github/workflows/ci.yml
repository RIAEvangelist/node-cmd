name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install package metadata
        run: npm ci

      - name: Run cross-platform tests
        run: npm test

  coverage:
    name: Built-in Node coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install package metadata
        run: npm ci

      - name: Run coverage gates
        run: npm run coverage

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install package metadata
        run: npm ci

      - name: Install and import the packed package
        run: npm run test:package

      - name: Pack npm artifact
        run: npm pack --silent

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-cmd-v6-package
          path: node-cmd-6.0.0.tgz
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Assemble GitHub Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - test
      - coverage
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install package metadata
        run: npm ci

      - name: Validate static site
        run: npm run site:check

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp --recursive site/. _site/
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/og.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
